<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<main id="main-holder">
    <a href="/logout" id="logout">Logout</a>

    <h1 id="login-header">Login</h1>

    <div id="login-error-msg-holder">
        <p id="login-error-msg">Invalid username <span id="error-msg-second-line">and/or password</span></p>
    </div>

    <form id="login-form" action="/api/login" method="post">
        <label for="username-field"></label><input type="text" name="login" id="username-field" class="login-form-field" placeholder="Username">
        <label for="password-field"></label><input type="password" name="password" id="password-field" class="login-form-field" placeholder="Password">
        <input type="submit" value="Login" id="login-form-submit">
    </form>

    <a href="/auth" id="auth0-login">Login with Auth0</a>
    <a href="/passwordLogin" id="auth0pass-login">Login with Password grant type</a>
</main>

<script>
    const loginForm = document.getElementById("login-form");
    const loginErrorMsg = document.getElementById("login-error-msg");
    const logoutLink = document.getElementById("logout");

    const stored = sessionStorage.getItem("session");
    let token;
    try {
        token = JSON.parse(stored).token;
    } catch {
    }

    if (token) {
        axios.get("/", {headers: {Authorization: token}})
            .then((res) => {
                const {username} = res.data;
                if (username) {
                    document.body.innerHTML = `
          <main>
            <h1>Hello ${username}!</h1>
            <p><a href="/token">Get Management Token</a></p>
            <p><a href="/create-user">Create User via Auth0</a></p>
            <p><a href="/logout">Logout</a></p>
          </main>`;
                }
            });
    }

    logoutLink.addEventListener("click", (e) => {
        e.preventDefault();
        sessionStorage.removeItem("session");
        location.reload();
    });

    loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const login = loginForm.login.value;
        const password = loginForm.password.value;

        axios.post("/api/login", {login, password})
            .then((res) => {
                sessionStorage.setItem("session", JSON.stringify(res.data));
                location.reload();
            })
            .catch(() => {
                loginErrorMsg.style.opacity = 1;
            });
    });
</script>
</body>
</html>
